services:
  postgres:
    image: postgres:16
    container_name: lab4-postgres
    environment:
      POSTGRES_DB: lab4
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - lab4-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lab4"]
      interval: 3s
      timeout: 3s
      retries: 10

  app:
    build: .
    container_name: lab4-app
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/lab4
      DB_USER: postgres
      DB_PASSWORD: postgres

volumes:
  lab4-data:
